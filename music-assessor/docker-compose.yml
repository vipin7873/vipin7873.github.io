services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: music-assessor-backend
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/database
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: music-assessor-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
